<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cylee</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #fafafa;
      color: #222;
    }
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    h1 {
      font-weight: 300;
      font-size: 2.5rem;
      margin: 0 0 0.5rem;
    }
    p {
      color: #777;
      margin: 0;
    }
    .play {
      margin-top: 1.5rem;
      font-size: 0.95rem;
    }
    .play a {
      color: #555;
      text-decoration: none;
      border-bottom: 1px solid #ccc;
      padding-bottom: 1px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .play a:hover {
      color: #c47a3a;
      border-color: #c47a3a;
    }
  </style>
</head>
<body>
  <main>
    <h1>cylee</h1>
    <p>More soon.</p>
    <p class="play"><a href="flappy.html">play flappy capybara &rarr;</a></p>
  </main>
</body>
</html>
